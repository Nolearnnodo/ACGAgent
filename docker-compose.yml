# ACGAgent 一键编排
#
# 服务：
#   neo4j     图数据库（持久化到 named volume）
#   backend   FastAPI + alembic（启动时自动迁移）
#   frontend  Vue3 SPA + nginx 反代 /api → backend
#
# 数据卷：
#   neo4j_data    /data
#   neo4j_logs    /logs
#   sqlite_data   /app/backend/data    （SQLite 文件）
#
# 主机映射端口：
#   5173  前端
#   8000  后端
#   7474  Neo4j Browser (HTTP)
#   7687  Neo4j Bolt
#
# 使用：
#   1. cp .env.example .env  并修改 LLM_API_KEY、NEO4J_PASSWORD 等
#   2. docker compose up -d --build
#   3. 浏览器访问 http://localhost:5173

services:
  neo4j:
    image: neo4j:5.20-community
    container_name: acgagent-neo4j
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-please_change_me}
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: acgagent-backend
    env_file:
      - .env
    environment:
      # 容器内访问 Neo4j 用服务名，覆盖 .env 里的 localhost 设置
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-please_change_me}
      - NEO4J_DATABASE=neo4j
      # SQLite 落到 named volume，避免主机文件系统串味
      - SQLITE_DATABASE_URL=sqlite:////app/backend/data/acg_agent.sqlite3
      # 容器内 host 必须是 0.0.0.0
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      # 前端通过 nginx 反代访问，CORS 放开 5173 即可
      - APP_CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "${APP_PORT_HOST:-8000}:8000"
    volumes:
      # 开发期挂源码：改文件后重启容器即可生效（不开 --reload 以省 watch 开销）
      - ./backend:/app/backend
      # SQLite 持久化卷
      - sqlite_data:/app/backend/data
      # 输出 / 测试数据 / 背景知识 双向挂载
      - ./output:/app/output
      - ./test_data:/app/test_data:ro
      - ./data:/app/data:ro
      - ../开发阶段微数据集.xlsx:/app/micro_dataset.xlsx:ro
      - ./bg_knowledge:/app/bg_knowledge:ro
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: acgagent-frontend
    environment:
      # 让前端 axios 用相对路径 /api/v1 → vite proxy 反代到 backend
      - VITE_API_BASE_URL=/api/v1
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT_HOST:-5173}:5173"
    volumes:
      # 源码挂载，改 .vue / .ts 立即 HMR 热更新
      - ./frontend:/app/frontend
      # 容器内 node_modules 用 named volume 隔离，避免被主机空目录覆盖
      - frontend_node_modules:/app/frontend/node_modules
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  sqlite_data:
  frontend_node_modules:
